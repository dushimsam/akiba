services:
  postgres:
    image: postgres:17-alpine
    container_name: akiba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - akiba-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: akiba-server
    restart: unless-stopped
    environment:
      PORT: ${SERVER_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${SERVER_PORT:-3000}:${SERVER_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - akiba-network
    volumes:
      - ./server:/app:delegated
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${SERVER_PORT:-3000}/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: akiba-client
    restart: unless-stopped
    command: npm run dev -- --host
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "${CLIENT_PORT:-5173}:${CLIENT_PORT:-5173}"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - akiba-network
    volumes:
      - ./client:/app:delegated
      - /app/node_modules

volumes:
  postgres_data:
    driver: local

networks:
  akiba-network:
    driver: bridge
