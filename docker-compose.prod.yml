# production stack — pulls the image CD pushed to ECR
# local docker-compose.yml is for day-to-day dev, leave it alone

services:
  app:
    image: ${ECR_IMAGE}
    container_name: akiba-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-true}
    healthcheck:
      # node 20 has fetch, alpine image has no wget
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
