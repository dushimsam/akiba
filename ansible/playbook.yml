---
- name: Configure application VM for Docker workloads
  hosts: app
  become: true
  gather_facts: yes
  vars:
    docker_prereqs:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
    docker_compose_path: /usr/local/bin/docker-compose
    docker_compose_url: "https://github.com/docker/compose/releases/latest/download/docker-compose-{{ ansible_facts.system }}-{{ ansible_facts.architecture }}"

  tasks:
    - name: Ensure apt cache is updated
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name: "{{ docker_prereqs }}"
        state: present

    - name: Remove legacy Docker APT repository file
      file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    - name: Add Docker APT repository
      deb822_repository:
        name: docker
        types: deb
        architectures: amd64
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts.distribution_release }}"
        components: stable
        signed_by: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Install Docker Engine and supporting packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Install Docker Compose binary
      get_url:
        url: "{{ docker_compose_url }}"
        dest: "{{ docker_compose_path }}"
        mode: '0755'

    - name: Ensure Docker service is enabled and started
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Verify Docker installation
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Verify Docker Compose installation
      command: docker-compose --version
      register: compose_version
      changed_when: false

    - name: Display installed Docker versions
      debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ compose_version.stdout }}"
