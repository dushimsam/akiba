---
- name: Update system packages
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes
  tags:
    - docker
    - system
- name: Install required system packages
  apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
      - git
      - ufw
  become: yes
  tags:
    - docker
    - system
- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  become: yes
  tags:
    - docker
- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
  become: yes
  tags:
    - docker
- name: Install Docker
  apt:
    name: docker-ce
    state: present
  become: yes
  tags:
    - docker
- name: Install Docker Compose from Docker repository
  shell: curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
  args:
    creates: /usr/local/bin/docker-compose
  become: yes
  tags:
    - docker
- name: Make docker-compose executable
  file:
    path: /usr/local/bin/docker-compose
    mode: 'a+x'
  become: yes
  tags:
    - docker
- name: Verify docker-compose installation
  command: docker-compose --version
  register: docker_compose_version
  tags:
    - docker
    - verify
- name: Display docker-compose version
  debug:
    msg: "{{ docker_compose_version.stdout }}"
  tags:
    - docker
    - verify
- name: Start Docker service
  systemd:
    name: docker
    state: started
    enabled: yes
  become: yes
  tags:
    - docker
- name: Create docker group
  group:
    name: docker
    state: present
  become: yes
  tags:
    - docker
- name: Add user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  become: yes
  tags:
    - docker
- name: Reset SSH connection to apply docker group changes
  meta: reset_connection
  tags:
    - docker
