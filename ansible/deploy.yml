---
- name: Deploy Akiba application on the app VM
  hosts: app
  become: true
  gather_facts: yes
  vars:
    app_dir: /opt/akiba
    repo_url: https://github.com/dushimsam/akiba.git
    repo_branch: main

  tasks:
    - name: Install git
      apt:
        name: git
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Clone or update the Akiba repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: yes

    - name: Create production docker-compose file
      copy:
        dest: "{{ app_dir }}/docker-compose.prod.yml"
        mode: '0644'
        content: |
          services:
            postgres:
              image: postgres:17-alpine
              container_name: akiba-postgres
              restart: unless-stopped
              environment:
                POSTGRES_USER: ${POSTGRES_USER:-akiba}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
                POSTGRES_DB: ${POSTGRES_DB:-akiba}
              volumes:
                - postgres_data:/var/lib/postgresql/data
              networks:
                - akiba-network
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U akiba -d akiba"]
                interval: 10s
                timeout: 5s
                retries: 5
                start_period: 10s

            app:
              build:
                context: .
                dockerfile: Dockerfile
              container_name: akiba-app
              restart: unless-stopped
              environment:
                PORT: 3000
                NODE_ENV: production
                DATABASE_URL: postgres://${POSTGRES_USER:-akiba}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-akiba}
                DATABASE_SSL: "false"
              ports:
                - "3000:3000"
              depends_on:
                postgres:
                  condition: service_healthy
              networks:
                - akiba-network
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
                interval: 15s
                timeout: 5s
                retries: 5
                start_period: 15s

          volumes:
            postgres_data:
              driver: local

          networks:
            akiba-network:
              driver: bridge

    - name: Create production .env file
      copy:
        dest: "{{ app_dir }}/.env"
        mode: '0600'
        content: |
          POSTGRES_USER=akiba
          POSTGRES_PASSWORD=changeme
          POSTGRES_DB=akiba
          SERVER_PORT=3000
          NODE_ENV=production
          DATABASE_URL=postgres://akiba:changeme@postgres:5432/akiba
          DATABASE_SSL=false

    - name: Stop existing containers (if any)
      command: docker compose -f docker-compose.prod.yml down --remove-orphans
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: true

    - name: Build and start the application with Docker Compose
      command: docker compose -f docker-compose.prod.yml up -d --build
      args:
        chdir: "{{ app_dir }}"
      register: compose_result
      async: 600
      poll: 15

    - name: Show Docker Compose output
      debug:
        var: compose_result.stdout_lines

    - name: Wait for the app to become healthy
      uri:
        url: http://localhost:3000/api/health
        method: GET
        status_code: 200
      register: health_check
      retries: 15
      delay: 10
      until: health_check.status == 200

    - name: Display health check result
      debug:
        msg: "App is healthy: {{ health_check.json }}"

# ==================== PLAY 2 – BASTION HOST ====================
- name: Set up Nginx reverse proxy on the bastion host
  hosts: bastion
  become: true
  gather_facts: yes

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Configure Nginx reverse proxy to app VM
      copy:
        dest: /etc/nginx/sites-available/akiba
        mode: '0644'
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              location / {
                  proxy_pass http://10.0.1.101:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
                  proxy_read_timeout 90;
              }
          }

    - name: Enable the Akiba site
      file:
        src: /etc/nginx/sites-available/akiba
        dest: /etc/nginx/sites-enabled/akiba
        state: link

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test Nginx configuration
      command: nginx -t
      register: nginx_test
      changed_when: false

    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded
        enabled: yes

    - name: Verify public access to the app
      uri:
        url: http://127.0.0.1/api/health
        method: GET
        status_code: 200
      register: public_health
      retries: 3
      delay: 5
      until: public_health.status == 200

    - name: Display public access result
      debug:
        msg: "Application is publicly accessible! Health: {{ public_health.json }}"
