---
app_name: akiba
app_version: "1.0.0"
server_port: 3000
node_env: production
server_env: production
region: KGL-1
postgres_user: akiba
postgres_db: akiba
postgres_port: 5432
deployment_user: appuser
ssh_port: 22
ssh_max_auth_tries: 3
ssh_login_grace_time: 20
enable_firewall: true
firewall_policy: deny
firewall_default_incoming: deny
firewall_default_outgoing: allow
fail2ban_enabled: true
fail2ban_bantime: 3600
fail2ban_findtime: 600
fail2ban_maxretry: 5
docker_install_from_repository: true
docker_compose_version: latest
health_check_enabled: true
health_check_endpoint: /api/health
health_check_timeout: 5
health_check_retries: 5
log_level: info
logs_directory: /var/log/akiba
backup_enabled: true
backup_directory: /opt/akiba/backups
backup_retention_days: 7
backup_schedule_hour: "2"
backup_schedule_minute: "0"
cors_origin: "*"
app_directory: /opt/akiba
app_user: appuser
app_group: docker
systemd_service_enabled: true
systemd_restart_on_failure: true
systemd_restart_delay: 10
